<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Document</title>
</head>
<body>
   <div class ="container">
     <div class = "row">
         <div class ="col-12 text-center">
            <h2>evden çalışma anketi</h2>
         </div>
         <div class="d-none">

         </div>
      </div>
   </div>
    <div class = "container">
      <form action="" class ="form">
      <div class ="row ">
         <div class="col-12 align-items-center">
           1- sizce evden çalışmak verimli mi
         </div>
         <div class="col-12">
            <p style="display: inline;">evet</p>
            <input type="radio" class="rad" name="a" id="" value="1">
         </div>
         <div class="col-12">
            <p style="display: inline;">hayır</p>
            <input type="radio" class ="rad" name="a"  value="0">
         </div>
      </div>
      <div class ="row ">
         <div class="col-12 align-items-center">
           2-  evde kendimi daha rahat hissediyorum
         </div>
         <div class="col-12">
            <p style="display: inline;">evet</p>
            <input type="radio" class="rad" name="d" id="" value="1">
           
         </div>
         <div class="col-12">
            <p style="display: inline;">hayır</p>
            <input type="radio" class ="rad" name="d"  value="0">
         </div>
      </div>
      <div class ="row ">
         <div class="col-12 align-items-center">
           3- evde teknik sorunları kendim çözebiliyorum 
         </div>
         <div class="col-12">
            <p style="display: inline;">evet</p>
            <input type="radio" class="rad" name="b" id="" value="1">
           
         </div>
         <div class="col-12">
            <p style="display: inline;">hayır</p>
            <input type="radio" class ="rad" name="b"  value="0">
         </div>
         <div class ="row ">
            <div class="col-12 align-items-center">
              4- evde çalışmaktan memnumum
            </div>
            <div class="col-12">
               <p style="display: inline;">evet</p>
               <input type="radio" class="rad" name="c" id="" value="1">
              
            </div>
            <div class="col-12">
               <p style="display: inline;">hayır</p>
               <input type="radio" class ="rad" name="c"  value="2">
            </div>
   
         </div>
      </div>
      <button>gönder</button>
   </form>

    </div>
   <div class ="yazı">

   </div>

<script>
   const form = document.querySelector('.form')
 let yazı = document.querySelector('.yazı')
      form.addEventListener('submit', e => {
  e.preventDefault(); 
  let array = [{katkı:10,cevap:0},{katkı:40,cevap:0},{katkı:30,cevap:0},{katkı:20,cevap:0}];
  
  let yüzde = 0; 
  let seçilibutonlar = document.querySelectorAll('.rad:checked');
  if (seçilibutonlar.length !== 4) { 
    alert("Lütfen tüm seçenekleri işaretleyin.");
    return;
  }      
  let i= 0; 
 seçilibutonlar.forEach(e=>{

   array[i].cevap= parseInt( e.value);
   i = i+1;
 })
// console.log(array);
  array.forEach(e => {
      if( parseInt (e.cevap)==1){
         yüzde+=e.katkı;
      }
  });
   yazı.textContent=`evden çalışmaya % ${yüzde} kadar uyumlusunuz`;

});

</script>
</body>
</html>
